name: Build and deploy site

# Every push to main rebuilds the page from src/content.json and publishes it to
# https://cyber-llm.github.io/. Figures are committed (SVG + WebP), so no PDF tools are needed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (blurred figure previews)
        run: pip install pillow
      - name: Build public site
        run: |
          python src/build.py --skip-assets --public
          rm -f public/.public-export
          test -f public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
